<html
<head>
    <title>User Registration Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f2f2f2;
        }

        form{
            width:300px;
            margin:30px auto;
            background-color:white;
            border:2px solid black;
            padding:15px;
        }

        h2{
            text-align:center;
            color:blue;
        }

        input{
            width:100%;
            margin:5px 0 10px;
            padding:5px;
            box-sizing:border-box;
        }

        input[type="radio"]{
            width:auto;
        }


        input[type="submit"]{
            background-color:green;
            color:white;
            border:none;
            padding:8px;
            cursor:pointer;
        }

        input[type="reset"]{
            background-color:red;
            color:white;
            border:none;
            padding:8px;
            cursor:pointer;
        }

        #success
{ text-align:center; color:green; font-weight:bold; margin-top:10px; } </style> </head> <body> <form onsubmit="return register()"> <h2>Registration Form</h2> Name:<br> <input type="text" id="name" required><br> Roll No:<br> <input type="text" id="roll" required><br> Phone:<br> <input type="text" id="phone" required><br>
Alternate Phone Number:<br>
    <input type="text" id="altphone" maxlength="10"><br>
 Email:<br> <input type="email" id="email" required><br> 
Password:<br> <input type="password" id="password" required><br>
 Gender:<br> <input type="radio" name="gender" required> Male 
<input type="radio" name="gender"> Female <br><br> 
<input type="submit" value="Register"> 
<input type="reset" value="Reset" 
onclick="clearMessage()"> 
<p id="success"></p>
 </form> <script> function register() { let phone = document.getElementById("phone").value;
 let password = document.getElementById("password").value;
 if(phone.length >= 10 && password.length >= 6) {
 document.getElementById("success").innerHTML = "Registered Successfully!"; return false;
 } else { alert("Please enter valid details"); return false;
 } } function clearMessage() { 
document.getElementById("success").innerHTML = ""; } 
</script>
 </body>
 </html>
